services:
  smart-weather:
    container_name: smart-weather
    privileged: true
    image: pl.smartweather.app/smart-weather:latest
    ports:
      - "8081:8081"
  mongo:
    image: mongo:4.4.18
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
volumes:
  mongodb-data: