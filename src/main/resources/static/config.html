<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="scripts/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style/GlobalStyle.css">
    </style>
</head>


<body>
    <!-- Navbar display-->
    <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home"
                aria-selected="true" id="homeButton">Home</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-target="#pills-forecast" type="button" role="tab"
                aria-controls="pills-forecast" aria-selected="false" id="forecastButton">Forecast</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-target="#pills-config" type="button" role="tab"
                aria-controls="pills-config" aria-selected="false" id="configButton">Config</button>
        </li>
    </ul>
    <div class="tab-content" id="pills-tabContent">
        <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab"></div>
        <div class="tab-pane fade" id="pills-forecast" role="tabpanel" aria-labelledby="pills-forecast-tab"></div>
        <div class="tab-pane fade" id="pills-config" role="tabpanel" aria-labelledby="pills-config-tab"></div>
    </div>

    <!-- Config Header-->
    <div class="text-center text-info">
        <h1 class="display-2">My Configuration
            <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor"
                class="bi bi-gear adjust-button" viewBox="0 0 16 16">
                <path
                    d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0" />
                <path
                    d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z" />
            </svg>
        </h1>
        <hr>
    </div>

    <!-- User Table with add button-->
    <div class="container">
        <div class="row">
            <div class="col-md-6 border-end">
                <h3 class="display-6 text-info">Users directory:</h3>
                <a class="btn btn-primary btn-sm adjust-button" id="addUserForm">Add new User</a>

                <table class="table table-bordered table-striped table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Nr.</th>
                            <th>User e-mail adress</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

            <!-- App Configuration-->
            <div class="col-md-6">
                <h3 class="display-6 text-info">Options panel:</h5>
                    <p class="text-teal">Main settings:</p>
                    <div class="mb-4">
                        <label for="locationInput" class="form-label">Location:</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="locationInput" placeholder="" disabled>
                            <button class="btn btn-outline-primary" type="button" id="unlockLocation">🔓</button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="mailHost" class="form-label">Host:</label>
                        <input type="text" class="form-control mb-2" id="mailHost" placeholder="" disabled>

                        <label for="mailPort" class="form-label">Port:</label>
                        <input type="text" class="form-control mb-2" id="mailPort" placeholder="587" disabled>

                        <label for="mailName" class="form-label">Sender mail:</label>
                        <input type="text" class="form-control mb-2" id="mailName" placeholder="" disabled>

                        <label for="mailPassword" class="form-label">Password:</label>
                        <input type="password" class="form-control mb-2" id="mailPassword" placeholder="*************"
                            disabled>

                        <label for="apiKey" class="form-label">API Key:</label>
                        <input type="password" class="form-control mb-2" id="apiKey" placeholder="*************"
                            disabled>

                        <button class="btn btn-outline-warning mt-2" id="unlockSettings">🔓 Unlock main
                            settings</button>
                    </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <!--Add user form && ErrorMessage-->
                <div class="modal-body">
                    <form id="addUser">
                        <div class="mb-3">
                            <label for="username" class="form-label">User e-mail</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div id="errorMessage" class="text-danger" style="display:none"></div>
                    </form>
                </div>
                <!-- Modal buttons-->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="addUser" class="btn btn-primary">Save User</button>
                </div>
            </div>
        </div>
    </div>




    <script src="scripts/navBarScript.js"></script>
    <script src="scripts/configScript.js"></script>
</body>

</html>
